name: score
on:
  schedule:
    - cron: "30 14 * * *"   # after the day-ahead results are published
    - cron: "30 16 * * *"   # retry; scoring is idempotent
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Self-test the scoring path on a past day, print daily rows, write nothing"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Score (actuals fetched in memory, only daily rows written)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/score.py --dry-run --selftest "$(date -u -d '-4 days' +%Y-%m-%d)"
          else
            python src/score.py
          fi
      - name: Commit scores
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f scores.csv ] || { echo "no scores yet"; exit 0; }
          git add scores.csv
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "scores (run ${{ github.run_id }})"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
