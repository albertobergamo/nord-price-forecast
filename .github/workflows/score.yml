name: score
on:
  schedule:
    - cron: "30 14 * * *"   # after the day-ahead results are published
    - cron: "30 16 * * *"   # retry; scoring is idempotent
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download recent GME prices
        run: python src/fetch_gme.py "$(date -u -d '-10 days' +%Y-%m)" "$(date -u -d '+1 day' +%Y-%m)" --lenient
      - run: python src/score.py
      - name: Commit scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.csv
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "scores (run ${{ github.run_id }})"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
